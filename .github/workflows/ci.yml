name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 仓库里 .cargo/config.toml 为 Windows 本地路径做了 target-dir 覆盖；CI 用环境变量优先覆盖
  CARGO_TARGET_DIR: target

jobs:
  # 1) Rust 核心：编译 + 单元/契约测试（validate / learn / chat / outcheck）
  core:
    name: core (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  # 2) 学科包校验（用 CLI 跑两个包，0 错误才算过）
  packs:
    name: validate subject packs
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build CLI
        working-directory: core
        run: cargo build --bin wordo
      - name: Validate packs
        run: |
          set -e
          for p in packs/*/; do
            echo "== $p"
            ./core/target/debug/wordo validate-pack "$p"
          done

  # 3) 前端：语法检查 + 无头预览冒烟（不需要 Rust）
  frontend:
    name: frontend (syntax + headless smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check apps/desktop/src/app.js
      - name: Preview backend smoke (no model calls)
        working-directory: tools/preview
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright-core@1.49.0 --no-audit --no-fund
          node -e "
          import('./backend.mjs').then(async (b) => {
            b.state.packsDir = process.cwd() + '/../../packs';
            b.state.domain = process.cwd() + '/domain-ci';
            b.state.configPath = process.cwd() + '/.config.json';
            const lp = await b.invoke('list_packs', { packsDir: b.state.packsDir });
            if (!lp.packs || lp.packs.length < 2) throw new Error('list_packs failed');
            const st = await b.invoke('learn_state', { domain: '', packsDir: b.state.packsDir });
            if (!st.userMd || !st.userMd.includes('学习者状态')) throw new Error('user.md failed');
            const v = await b.invoke('verify_ledger', { domain: '', packsDir: b.state.packsDir });
            if (!v.ok) throw new Error('ledger not ok');
            console.log('preview backend smoke OK', lp.packs.length, 'packs');
          });
          "

  # 3.5) 工具链自测：内容入库管线 / 极简节点桥 / 新建学科契约（纯 Node，零依赖）
  tools:
    name: tools (ingest + mininode + scaffold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Content ingest pipeline test (教材/出卷/OCR → 知识树+题库 + 校验)
        run: node tools/ingest/test.mjs
      - name: Mininode bridge test (导出卡片集 → 设备作答 → 入库账本 → 校验/幂等)
        run: node tools/mininode/test.mjs
      - name: New-subject contract test (scaffold_pack 三端同契约)
        run: node tools/preview/test-scaffold.mjs

  # 4) 桌面壳（Tauri2）：Linux 依赖较重，先作为「必须通过」的编译检查
  desktop:
    name: desktop shell (tauri build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev libsoup-3.0-dev
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --all-targets
